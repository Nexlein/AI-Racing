[project]
name = "ai-racing"
version = "0.1.0"
description = "Racing AI trained with reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "numpy",
    "pandas",
    "pygame",
    "PyYAML",
    "questionary",
    "stable-baselines3[extra]",
    "tensorboard",
    "torch",
]

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
# Same level as the editor (VSCodium basedpyright setting)
typeCheckingMode = "standard"
